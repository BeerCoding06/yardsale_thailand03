# Dokploy: deploy ไฟล์นี้ไฟล์เดียว — PostgreSQL + Express API + Nuxt
# เครือข่าย traefik ของ Dokploy (สร้างบน host แล้ว: dokploy-network)
#
# โดเมน:
#   Frontend — https://yardsaleth.com (Traefik labels บน service app)
#   Backend  — https://api.yardsaleth.com (Traefik labels บน service backend — /api + /uploads)
#
# สำคัญ (Cloudflare Full strict / Error 526 บน /uploads):
#   - Express ให้บริการทั้ง /api/* และ /uploads/* ที่พอร์ต 4000 (Option A — service เดียว)
#   - อย่าให้ /uploads ชี้ไป container อื่นหรือ HTTP-only โดยไม่มี TLS
#   - ถ้าเคยใช้ Caddy บน host สำหรับ api.yardsaleth.com ให้ลบ block นั้นออก (กันชน :443 กับ Traefik)
#   - ใน Dokploy Domains: ลบ domain ซ้ำ api.yardsaleth.com ที่แยก path /uploads ไป service อื่น
#   - ใช้ labels ด้านล่างของ backend เป็นแหล่ง routing หลัก
#
# ตั้งค่าใน Dokploy → Environment (ของแอป Compose นี้) ก่อน Deploy:
#   POSTGRES_PASSWORD และ JWT_SECRET ต้องมีค่า — ใส่เป็นสองแถว แยก Key / Value
#   ถ้า Dokploy ยัง error เรื่อง missing variable ให้เช็กว่าใส่ในแอป Compose ตัวนี้ ไม่ใช่แค่ Project
#   CORS_ORIGINS, BASE_URL, NUXT_* ฯลฯ
#   BASE_URL, NUXT_PUBLIC_CMS_API_BASE, NUXT_PUBLIC_YARDSALE_BACKEND_ORIGIN, NUXT_PUBLIC_STORE_BANK_TRANSFER_INFO, NUXT_PUBLIC_PROMPTPAY_QR_URL, NUXT_PUBLIC_PROMPTPAY_ID (เลขพร้อมเพย์ → สร้าง QR ในเบราว์เซอร์), NUXT_PUBLIC_PROMPTPAY_QR_INCLUDE_AMOUNT=true ฝังยอดใน QR (บางแอปสแกนไม่ได้ — ปล่อยว่าง/false แนะนำ), NUXT_IMAGE_DOMAINS
#   DB_PASSWORD ถ้า Nuxt build ต้องคุย MySQL ภายนอก
#
# Traefik: cert resolver ชื่อ letsencrypt — ถ้า Dokploy ใช้ชื่ออื่น แก้ labels ของ app และ backend

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - dokploy-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yardsale}
      POSTGRES_USER: ${POSTGRES_USER:-yardsale}
      # ถ้า Dokploy ไม่ส่ง env เข้า compose ค่าว่างทำให้ Postgres ล้ม — ค่า default นี้ให้ stack ขึ้นได้; ควร override ใน Dokploy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - yardsale_postgres_data:/var/lib/postgresql/data
    # ใช้ user/db ตรงกับค่า default — ถ้าเปลี่ยน POSTGRES_USER / POSTGRES_DB ใน env ต้องแก้ healthcheck ให้ตรง
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-U", "yardsale", "-d", "yardsale"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 4000
      # บังคับ IPv4 ทุก interface — ถ้า Dokploy ใส่ HOST อื่น อาจ bind แค่ IPv6 แล้ว healthcheck 127.0.0.1 ล้ม
      HOST: "0.0.0.0"
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-yardsale}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-yardsale}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      # OAuth — ค่าจริงใส่ใน Dokploy / .env ที่ compose อ่านได้ (ดู docs/SOCIAL_AUTH_SETUP.md)
      SESSION_SECRET: ${SESSION_SECRET:-}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-}
      OAUTH_FRONTEND_SUCCESS_URL: ${OAUTH_FRONTEND_SUCCESS_URL:-}
      OAUTH_FRONTEND_FAILURE_URL: ${OAUTH_FRONTEND_FAILURE_URL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      LINE_CHANNEL_ID: ${LINE_CHANNEL_ID:-}
      LINE_CHANNEL_SECRET: ${LINE_CHANNEL_SECRET:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-./uploads}
      PUBLIC_UPLOAD_BASE: ${PUBLIC_UPLOAD_BASE:-/uploads}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://yardsaleth.com,https://www.yardsaleth.com}
      SLIPOK_BRANCH_ID: ${SLIPOK_BRANCH_ID:-}
      SLIPOK_API_KEY: ${SLIPOK_API_KEY:-}
      SLIPOK_API_BASE: ${SLIPOK_API_BASE:-https://api.slipok.com}
      SLIPOK_LOG_DEFAULT: ${SLIPOK_LOG_DEFAULT:-true}
      # Thailand Post Track&Trace — EMS / ไปรษณีย์ไทย (เลขลงท้าย TH); สร้าง key ที่ https://track.thailandpost.co.th/dashboard
      THAILAND_POST_API_KEY: ${THAILAND_POST_API_KEY:-}
      # แนะนำ production: ใส่ base64 แทน plain key ถ้า token มี $ (Docker Compose ตัด $ ออก)
      THAILAND_POST_API_KEY_B64: ${THAILAND_POST_API_KEY_B64:-}
      # 17TRACK — fallback สำหรับขนส่งอื่น; POST /api/track
      SEVENTEEN_TRACK_API_KEY: ${SEVENTEEN_TRACK_API_KEY:-}
      SEVENTEEN_TRACK_BASE_URL: ${SEVENTEEN_TRACK_BASE_URL:-https://api.17track.net}
      TRACK_API_RATE_LIMIT_PER_MINUTE: ${TRACK_API_RATE_LIMIT_PER_MINUTE:-30}
      # FCM (optional) — ดู backend/.env.example และ backend/docs/FCM_SETUP.md
      # PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-https://www.yardsaleth.com}
      # FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      # FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      # FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # หรือ FIREBASE_CREDENTIALS_JSON / FIREBASE_CREDENTIALS (path ใน volume)
    volumes:
      - yardsale_uploads:/app/uploads
    # Publish 4000 สำหรับ debug / health จาก host (Traefik ใช้ docker network ภายใน)
    ports:
      - "4000:4000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # api.yardsaleth.com — Express: /api/* + /uploads/* (static) ที่พอร์ต 4000
      # priority สูงกว่า router จาก Dokploy UI ที่อาจแยก path แล้วชี้ service ผิด → CF 526
      - "traefik.http.routers.yardsaleth-api-uploads.rule=Host(`api.yardsaleth.com`) && PathPrefix(`/uploads`)"
      - "traefik.http.routers.yardsaleth-api-uploads.priority=220"
      - "traefik.http.routers.yardsaleth-api-uploads.entrypoints=websecure"
      - "traefik.http.routers.yardsaleth-api-uploads.tls=true"
      - "traefik.http.routers.yardsaleth-api-uploads.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yardsaleth-api-uploads.middlewares=yardsaleth-api-compress"
      - "traefik.http.routers.yardsaleth-api-uploads.service=yardsaleth-api"
      - "traefik.http.routers.yardsaleth-api.rule=Host(`api.yardsaleth.com`)"
      - "traefik.http.routers.yardsaleth-api.priority=200"
      - "traefik.http.routers.yardsaleth-api.entrypoints=websecure"
      - "traefik.http.routers.yardsaleth-api.tls=true"
      - "traefik.http.routers.yardsaleth-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yardsaleth-api.middlewares=yardsaleth-api-compress"
      - "traefik.http.routers.yardsaleth-api.service=yardsaleth-api"
      - "traefik.http.services.yardsaleth-api.loadbalancer.server.port=4000"
      - "traefik.http.middlewares.yardsaleth-api-compress.compress=true"
      # HTTP → HTTPS
      - "traefik.http.routers.yardsaleth-api-http.rule=Host(`api.yardsaleth.com`)"
      - "traefik.http.routers.yardsaleth-api-http.entrypoints=web"
      - "traefik.http.routers.yardsaleth-api-http.middlewares=yardsaleth-api-redirect-https"
      - "traefik.http.middlewares.yardsaleth-api-redirect-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.yardsaleth-api-redirect-https.redirectscheme.permanent=true"
    # /health ไม่แตะ DB — ใช้ module http (ไม่พึ่ง fetch) ลดโอกาส probe ล้มบน Alpine
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||4000)+'/health',(r)=>{r.resume();r.on('end',()=>process.exit(r.statusCode===200?0:1));}).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 90s

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        DB_HOST: ${DB_HOST:-157.85.98.150:3306}
        DB_NAME: ${DB_NAME:-nuxtcommerce_db}
        DB_USER: ${DB_USER:-root}
        BASE_URL: ${BASE_URL:-https://yardsaleth.com}
        NUXT_PUBLIC_CMS_API_BASE: ${NUXT_PUBLIC_CMS_API_BASE:-https://api.yardsaleth.com/api}
        NUXT_PUBLIC_YARDSALE_BACKEND_ORIGIN: ${NUXT_PUBLIC_YARDSALE_BACKEND_ORIGIN:-https://api.yardsaleth.com}
        NUXT_PUBLIC_STORE_BANK_TRANSFER_INFO: ${NUXT_PUBLIC_STORE_BANK_TRANSFER_INFO:-}
        NUXT_PUBLIC_PROMPTPAY_QR_URL: ${NUXT_PUBLIC_PROMPTPAY_QR_URL:-}
        NUXT_PUBLIC_PROMPTPAY_ID: ${NUXT_PUBLIC_PROMPTPAY_ID:-}
        NUXT_PUBLIC_PROMPTPAY_QR_INCLUDE_AMOUNT: ${NUXT_PUBLIC_PROMPTPAY_QR_INCLUDE_AMOUNT:-false}
        NUXT_IMAGE_DOMAINS: ${NUXT_IMAGE_DOMAINS:-api.yardsaleth.com,yardsaleth.com,www.yardsaleth.com}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - dokploy-network
    # รอแค่ backend ขึ้น process — ไม่รอ service_healthy (probe กับ timing/Dokploy ทำให้ deploy ค้างได้)
    depends_on:
      backend:
        condition: service_started
    environment:
      NODE_ENV: production
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3000
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      # ให้ Nitro proxy /yardsale-api และ /uploads ไปที่ Express ใน stack เดียวกัน
      NUXT_YARDSALE_PROXY_TARGET: http://backend:4000
      BASE_URL: ${BASE_URL:-https://yardsaleth.com}
      DB_HOST: ${DB_HOST:-157.85.98.150:3306}
      DB_NAME: ${DB_NAME:-nuxtcommerce_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      # เว็บหลัก — apex
      - "traefik.http.routers.yardsaleth-app.rule=Host(`yardsaleth.com`)"
      - "traefik.http.routers.yardsaleth-app.entrypoints=websecure"
      - "traefik.http.routers.yardsaleth-app.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yardsaleth-app.middlewares=yardsaleth-compress"
      - "traefik.http.routers.yardsaleth-app.service=yardsaleth-app"
      - "traefik.http.services.yardsaleth-app.loadbalancer.server.port=3000"
      - "traefik.http.middlewares.yardsaleth-compress.compress=true"
      # www — same-origin Nitro proxy (ไม่ redirect ไป apex)
      - "traefik.http.routers.yardsaleth-www-api.rule=Host(`www.yardsaleth.com`) && (PathPrefix(`/yardsale-api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.yardsaleth-www-api.priority=100"
      - "traefik.http.routers.yardsaleth-www-api.entrypoints=websecure"
      - "traefik.http.routers.yardsaleth-www-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yardsaleth-www-api.middlewares=yardsaleth-compress"
      - "traefik.http.routers.yardsaleth-www-api.service=yardsaleth-app"
      # www → https://yardsaleth.com/... (เฉพาะ path ที่ไม่ใช่ proxy ไป Express)
      - "traefik.http.routers.yardsaleth-www.rule=Host(`www.yardsaleth.com`) && !PathPrefix(`/yardsale-api`) && !PathPrefix(`/uploads`)"
      - "traefik.http.routers.yardsaleth-www.priority=10"
      - "traefik.http.routers.yardsaleth-www.entrypoints=websecure"
      - "traefik.http.routers.yardsaleth-www.tls.certresolver=letsencrypt"
      - "traefik.http.routers.yardsaleth-www.middlewares=yardsaleth-www-to-apex"
      - "traefik.http.routers.yardsaleth-www.service=yardsaleth-app"
      - "traefik.http.middlewares.yardsaleth-www-to-apex.redirectregex.permanent=true"
      - "traefik.http.middlewares.yardsaleth-www-to-apex.redirectregex.regex=^https?://www\\.yardsaleth\\.com/(.*)"
      - "traefik.http.middlewares.yardsaleth-www-to-apex.redirectregex.replacement=https://yardsaleth.com/$${1}"

networks:
  dokploy-network:
    external: true

volumes:
  yardsale_postgres_data:
  yardsale_uploads:
